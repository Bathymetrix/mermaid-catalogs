[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mermaid-catalogs"
dynamic = ["version"]
description = "Build and verify provenance-preserving MERMAID output catalogs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "MERMAID contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9", "obspy>=1.5,<2"]
verify = ["obspy>=1.5,<2"]

[project.scripts]
mermaid-catalogs = "mermaid_catalogs.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mermaid_catalogs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
